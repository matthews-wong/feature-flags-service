[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "featureflags"
version = "0.1.0"
description = "Lightweight feature-flag service: boolean flags, percentage rollouts, and targeting rules."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matthews Wong" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.13.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["featureflags"]

[tool.pytest.ini_options]
testpaths = ["tests"]
